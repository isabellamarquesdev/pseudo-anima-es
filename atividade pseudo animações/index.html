<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práticas de pseudo-classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Atividade de animações</h1>

    <h2>Palco Verical</h2>
     <div class="palco1">
        <div class="caixa1"></div>
    </div>

    <h2>Palco Horizontal</h2>
     <div class="palco2">
        <div class="caixa2"></div>
    </div>

     <h2>Palco Diagonal</h2>
     <div class="palco3">
        <div class="caixa3"></div>
    </div>

    <h2>Palco de Repetições</h2>
    <div class="opcoes">
    <div class="palcorapido">
        <div class="rapido"></div>
    </div>
    <div class="palcolento">
        <div class="lento"></div>
    </div>
    <div class="palconormal">
        <div class="normal"></div>
    </div>
    </div>

    <h2>Movimentos em Etapa</h2>
     <div class="palco4">
        <div class="caixa4"></div>
    </div>
    
</body>
</html>
